name: tag-and-release

on:
  push:
    branches:
      - main
    paths: 'setup.py'

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get version
        id: get_version
        run: |
          version=$(grep "version=" setup.py | cut -f2 -d"=" |tr -d "\""|tr -d ",")
          echo version=$version >> $GITHUB_OUTPUT
          echo version_tag=v$version >> $GITHUB_OUTPUT

      - name: Create tagger app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.TAGGER_APP_ID }}
          private-key: ${{ secrets.TAGGER_PRIVATE_KEY }}

      - name: Tag commit
        uses: tvdias/github-tagger@ed7350546e3e503b5e942dffd65bc8751a95e49d # v0.0.2
        with:
          repo-token: "${{ steps.app-token.outputs.token }}"
          tag: "${{steps.get_version.outputs.version_tag}}"

      - name: Extract from changelog
        id: extract_changes
        run: |
          # Must use a temporary file or it loses the formatting
          VERSION=${{steps.get_version.outputs.version}}; awk "/## \[$VERSION\]/{flag=1;next}/## \[/{flag=0}flag" CHANGELOG.md > REL-BODY.md

      - name: Create Relase TAR
        id: create_tar
        run: |
          mv github-secrets-manager.py github-secrets-manager
          tar cvzf ./github-secrets-manager-${{steps.get_version.outputs.version}}.tar.gz github-secrets-manager* requirements.txt setup.py README.md

      - name: Generate Checksum
        id: generate_checksum
        run: |
          checksum=$(sha256sum ./github-secrets-manager-${{steps.get_version.outputs.version}}.tar.gz | awk '{print $1}')
          echo "${checksum}" > sha256.sum
          echo "SHA256: ${checksum}" >> REL-BODY.md

      - name: Create Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{steps.get_version.outputs.version_tag}}
          artifacts: "github-secrets-manager*.tar.gz, sha256.sum"
          bodyFile: "REL-BODY.md"
          token: ${{ steps.app-token.outputs.token }}
          # An immutable release seals on publish, so assets have to land while
          # it is still a draft. This creates a draft, uploads, then publishes.
          immutableCreate: true
          # Upload failures were warnings, so a release could publish empty and green.
          artifactErrorsFailBuild: true

      - name: Delete stranded draft release
        if: failure()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{steps.get_version.outputs.version_tag}}
        run: |
          # A failed upload leaves the draft behind, and re-runs stack more of them.
          gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq '.[] | select(.draft and .tag_name == env.TAG) | .id' |
          while read -r id; do
            echo "Deleting stranded draft ${id} for ${TAG}"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}"
          done
